<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabelid HTML-keeles</title>
    <link rel="stylesheet" href="tableStyle.css">
</head>
<body>
<h1>Tabelid HTML-keeles</h1>
</body>
</html>
<h2>Kõige lihtsam tabel</h2>
<table id="punane">
    <capion>Tabel 1.</capion>
    <!--1.rida-->
    <tr>
        <td>1</td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
</table>
<h2>Natuke keerulisem tabel</h2>
<table id= "sinine">
    <caption>Tabel 2.</caption>
    <!--1.rida-->
    <tr>
        <td colspan="2">1</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
</table>

<h2>Veel üks nateke keerulisem tabel</h2>
<table id= "roheline">
    <caption>Tabel 3.</caption>
    <!--1.rida-->
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>4</td>
</table>
