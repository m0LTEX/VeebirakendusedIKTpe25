<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1>Lehel on kasutatud map area käsud</h1>
<h2>palun kliki hiirega pildi erineva alale </h2>
<img src="maja.png" alt="ilus maja" usemap="#majakaart">
<!-- kasutame map'i (kaart) -->
<map name="majakaart">
    <!-- ring -circle coords=x, y, R-->
    <area shape="circle" coords="232,87,50" href="aken.html" alt="aken">

    <!-- riskülik rect coords=x, y, x1, y2-->
    <area shape="rect" coords="300,19,333,83" href="korsten.html" alt="korsten">

    <!-- mitu nurga plügoon -poly  coords=x, y, x1, y1, x2, y2-kolmunrk-->
    <area shape="poly" coords="109,133,238,3,161,139" href="katus.html" alt="katus">
    <!-- riskülik rect coords=x, y, x1, y2-->
    <area shape="rect" coords="212,327,252,351" href="uks.html" alt="uks">

    <area shape="rect" coords="0,417,430,465" href="muru.html" alt="muru">

    <area shape="circle" coords="76,89,50" href="paike.html" alt="paike">
</map>
<div id="selgitus">
   Vajuta pildiala peale ja  siia tuleb väike kirjeldus...
</div>
</body>
</html>
