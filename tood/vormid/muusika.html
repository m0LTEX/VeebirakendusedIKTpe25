<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Muusika</title>
  <script src="../js/muusikascript.js"></script>
</head>
<body>
<from action="#">
  <table border="1">
    <tr>
      <td colspan="2">
        <fieldset>
          <legend>
            <strong>Muusikud</strong>
          </legend>
          <br>
          <input type="checkbox" name="Muusikud" id="Yeat" value="Yeat" onchange="Muusikud()">
          <label for="Yeat">Yeat</label>
          <br>
          <input type="checkbox" name="Muusikud" id="TravisScott" value="Travis Scott" onchange="Muusikud()">
          <label for="TravisScott">Travis Scott</label>

        </fieldset>
      </td>

      <td>
        <div id="vastus1"></div>
      </td>
    </tr>


    <tr>
      <td>
        <label>Mida arvad muusika kuulamisest koolis?</label>
      </td>
      <td>
        <input type="text" id="nimi" oninput="kool()">
      </td>
      <td>
        <div id="vastus2"></div>
      </td>
    </tr>

    <tr>
      <td>
        <label>Mitu tundi päevas kuulad muusikat?</label>
      </td>

      <td>
        <input type="number"
               min="0"
               max="24"
               step="1"
               value="0"
               id="tund"
               oninput="Muusikatunnid()">
      </td>

      <td>
        <div id="vastus3"></div>
      </td>
    </tr>

    <tr>
      <td>
        <label>Kas sa kuulad radiot?</label>
      </td>

      <td>
        <input type="radio"
               name="valik"
               id="Ja"
               value="Ja"
               onchange="raadiokuulamine()">

        <label for="Ja">Ja</label>

        <input type="radio"
               name="valik"
               id="Ei"
               value="Ei"
               onchange="raadiokuulamine()">

        <label for="Ei">Ei</label>
      </td>

      <td>
        <div id="vastus4"></div>
      </td>
    </tr>

    <tr>
      <td>
        <label for="radiojaam">
          Millised raadiojaamu oskad nimetada?
        </label>
      </td>

      <td>
        <input type="text"
               id="radiojaam"
               oninput="raadioJaam()">
      </td>

      <td>
        <div id="vastus5"></div>
      </td>
    </tr>

    <tr>
      <td>
        <label>Millist muusikat sa kõige rohkem kuulad?</label>
      </td>

      <td>

        <input type="checkbox"
               name="stiil"
               id="räpp"
               value="räpp"
               onchange="muusikastiilid()">
        <label for="räpp">Räpp</label>
        <br>

        <input type="checkbox"
               name="stiil"
               id="pop"
               value="pop"
               onchange="muusikastiilid()">
        <label for="pop">Pop</label>
        <br>

        <input type="checkbox"
               name="stiil"
               id="rock"
               value="rock"
               onchange="muusikastiilid()">
        <label for="rock">Rock</label>
        <br>

        <input type="checkbox"
               name="stiil"
               id="elektrooniline"
               value="elektrooniline"
               onchange="muusikastiilid()">
        <label for="elektrooniline">Elektrooniline</label>
        <br>

        <input type="checkbox"
               name="stiil"
               id="jazz"
               value="jazz"
               onchange="muusikastiilid()">
        <label for="jazz">Jazz</label>
        <br>

        <input type="checkbox"
               name="stiil"
               id="klassikaline"
               value="klassikaline"
               onchange="muusikastiilid()">
        <label for="klassikaline">Klassikaline</label>

      </td>

      <td>
        <div id="vastus6"></div>
      </td>
    </tr>


    <tr>
      <td>
        <input type="button"
               value="Puhasta"
               onclick="Puhasta()">
      </td>

      <td>
        <input type="button"
               value="Näita andmed"
               onclick="tervitus()">
      </td>

      <td>
        <div id="vastus7"></div>
      </td>
    </tr>

  </table>
</from>

</body>
</html>
