<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Muusika</title>
  <script src="../js/muusikascript.js"></script>
  <link rel="stylesheet" href="muusikaStyle.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script> $(function(){
    // peidame vead
    $('.viga').hide();

    // puhastusnupp
    $('#puhasta').click(function(){
      $('#muusikaVorm')[0].reset();
      $('.viga').hide();
    });

    // valideerimine, kui vorm on saadetud
    $('#muusikaVorm').submit(function(event){
      let valid = true;

      // 1. Checkbox
      if($('input[name="Muusikud"]:checked').length === 0){
        $('#viga1').show();
        valid = false;
      } else { $('#viga1').hide(); }

      // 1. Checkbox
      if($('input[name="Muusikud"]:checked').length === 0){
        $('#viga7').show();
        valid = false;
      } else { $('#viga7').hide(); }


      // 3. Number (0–24)
      let tunnid = $('#tund').val();
      if(tunnid === "" || isNaN(tunnid) || tunnid < 0 || tunnid > 24){
        $('#viga3').show();
        valid = false;
      } else { $('#viga3').hide(); }

      // 4. Radio
      if($('input[name="valik"]:checked').length === 0){
        $('#viga4').show();
        valid = false;
      } else { $('#viga4').hide(); }

      // 5. Text (ainult tähed)
      let tekst = $('#nimi').val().trim();
      if(tekst === "" || !/^[a-zA-Z\s]+$/.test(tekst)){
        $('#viga5').show();
        valid = false;
      } else { $('#viga5').hide(); }

      // 5. Text (ainult tähed)
      let tekst1 = $('#nimi').val().trim();
      if(tekst === "" ){
        $('#viga6').show();
        valid = false;
      } else { $('#viga6').hide(); }
    });
  });
  </script>

</head>
<body>
<h1>Muusika küsimustik</h1>
<form action="#" id="muusikaVorm">
  <table border="1">
    <tr>
      <td colspan="2">
        <fieldset>
          <legend>
            <strong>Milliseid muusikuid sa tead?</strong>
          </legend>

          <br>
          <input type="checkbox" name="Muusikud" id="Yeat" value="Yeat" onchange="Muusikud()">
          <label for="Yeat">Yeat</label>
          <br>
          <input type="checkbox" name="Muusikud" id="TravisScott" value="Travis Scott" onchange="Muusikud()">
          <label for="TravisScott">Travis Scott</label>
          <br>
          <input type="checkbox" name="Muusikud" id="Shakira" value="Shakira" onchange="Muusikud()">
          <label for="Shakira">Shakira</label>
          <br>
          <input type="checkbox" name="Muusikud" id="ViktorTsoi" value="Viktor Tsoi" onchange="Muusikud()">
          <label for="ViktorTsoi">Viktor Tsoi</label>
          <br>
          <input type="checkbox" name="Muusikud" id="Haddaway" value="Haddaway" onchange="Muusikud()">
          <label for="Haddaway">Haddaway</label>

        </fieldset>
      </td>

      <td>
        <div id="vastus1"></div>
        <span class="viga" id="viga1">Palun vali vähemalt ühe muusiku</span>
      </td>
    </tr>

    <tr>
      <td>
        <label>Mida arvad muusika kuulamisest koolis?</label>
      </td>
      <td>

        <input type="text" id="nimi" oninput="kool()">
      </td>
      <td>
        <div id="vastus2"></div>
        <span class="viga" id="viga5">Kirjuta tähtedega</span>
      </td>
    </tr>

    <tr>
      <td>
        <label>Mitu tundi päevas kuulad muusikat?</label>
      </td>

      <td>
        <input type="number" min="-1" max="26" step="1" value="" id="tund" oninput="Muusikatunnid()">
      </td>


      <td>
        <div id="vastus3"></div>
        <span class="viga" id="viga3">Palun täida väli 0 kuni 24</span>
      </td>
    </tr>

    <tr>
      <td>
        <label>Kas sa kuulad radiot?</label>
      </td>

      <td>
        <input type="radio" name="valik" id="Ja" value="Ja" onchange="raadiokuulamine()">
        <label for="Ja">Ja</label>
        <input type="radio" name="valik" id="Ei" value="Ei" onchange="raadiokuulamine()">
        <label for="Ei">Ei</label>
      </td>

      <td>
        <div id="vastus4"></div>
        <span class="viga" id="viga4">Tee valiku</span>
      </td>
    </tr>

    <tr>
      <td>
        <label for="radiojaam">Millised raadiojaamu oskad nimetada?</label>
      </td>

      <td>
        <input type="text" id="radiojaam" oninput="raadioJaam()">
      </td>

      <td>
        <div id="vastus5"></div>
        <span class="viga" id="viga6">Täida väli </span>
      </td>
    </tr>

    <tr>
      <td>
        <label>Millist muusikat sa kõige rohkem kuulad?</label>
      </td>

      <td>
        <input type="checkbox" name="stiil" id="räpp" value="räpp" onchange="muusikastiilid()">
        <label for="räpp">Räpp</label>
        <br>
        <input type="checkbox" name="stiil" id="pop" value="pop" onchange="muusikastiilid()">
        <label for="pop">Pop</label>
        <br>
        <input type="checkbox" name="stiil" id="rock" value="rock" onchange="muusikastiilid()">
        <label for="rock">Rock</label>
        <br>
        <input type="checkbox" name="stiil" id="elektrooniline" value="elektrooniline" onchange="muusikastiilid()">
        <label for="elektrooniline">Elektrooniline</label>
        <br>
        <input type="checkbox" name="stiil" id="jazz" value="jazz" onchange="muusikastiilid()">
        <label for="jazz">Jazz</label>
        <br>
        <input type="checkbox" name="stiil" id="klassikaline" value="klassikaline" onchange="muusikastiilid()">
        <label for="klassikaline">Klassikaline</label>
      </td>

      <td>
        <div id="vastus6"></div>
        <span class="viga" id="viga7">Palun vali vähemat ühe muusika stiili</span>
      </td>
    </tr>
    <tr>
      <td>
        <input type="button" value="Puhasta" id="puhasta" onclick="Puhasta()">
      </td>
      <td>
        <input type="button" value="Näita andmed" onclick="tervitus()">
        <input type="submit" value="Andmete kontroll">
      </td>
      <td>
        <div id="vastus7"></div>
      </td>
    </tr>

  </table>
</form>

</body>
</html>
