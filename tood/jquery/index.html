
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>jQuery kasutamine</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
            integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
            crossorigin="anonymous"></script>
    <script>
        $(document).ready(function() {
            // paremale nuppu vajutamine
            $('#paremale').click(function () {
                $('#tekstikast').animate({left: '200px'}, 1000);
                $(this).hide();
                $('#vasakule').show();
            });
            // vasakule nuppu vajutamine
            $('#vasakule').click(function () {
                $('#tekstikast').animate({left: '0px'}, 1000);
                $(this).hide();
                $('#paremale').show();
            });

            // Fading efektid
            $('#fadeIn').click(function () {
                $('#fadePilt').stop(true, true).fadeIn(2000);
            });

            $('#fadeOut').click(function () {
                $('#fadePilt').stop(true, true).fadeOut(2000);
            });

            $('#fadeToggle').click(function () {
                $('#fadePilt').stop(true, true).fadeToggle(2000);
            });

            $('#fadeTo').click(function () {
                $('#fadePilt').stop(true, true).fadeTo(2000, 0.3);
            });

            // vihjemullid
            $('.vihjemull').mouseover(function(e) {
                var mull = $(this).attr('title');

                $(this).attr('title','');

                $('#vihje').remove();
                $('body').append('<div id="vihje">' + mull + '</div>');

                $('#vihje').fadeIn(500);
                $('#vihje').fadeTo(10, 0.9);
            }).mousemove(function(e) {
                $('#vihje').css('top', e.pageY + 10 );
                $('#vihje').css('left', e.pageX + 20 );
            }).mouseout(function() {
                var mull = $('#vihje').html();

                $(this).attr('title', mull);
                $('#vihje').fadeOut(500, function() {
                    $(this).remove();
                });
            });
        });

        //värvib teksti punase värviga
        function tekstPunaseks(){
            $('#tekstikast').css('color', 'red')
        }
        function tekstMustaks(){
            $('#tekstikast').css('color', 'black')
        }
        function koordiLugemine(event, ui) {
            let koht = ui.offset;
            $('#koordinaadid').html('x:' + koht.left + '|| y:' + koht.top);
        }
        function pildiLugemine(event, ui){
            let koht=ui.offset;
            $('#koordinaadid').html('x:' + koht.left + '|| y:' + koht.top);
        }
        function leheStart(){
            $('#tekstikast').mouseenter(tekstPunaseks);
            $('#tekstikast').mouseleave(tekstMustaks);
            $('#tekstikast').draggable()
            $('#tekstikast').bind("drag", koordiLugemine)
            $('#pilt').draggable();
            $('#pilt').bind("drag", pildiLugemine)
        }
    </script>



    <link rel="stylesheet" href="queryStyle.css">
</head>
<body onload="leheStart()">
<header>
    <h1>jQuery kasutamine</h1>
</header>
<main>
    <section>
        <h2>jQuery CDN</h2>
        <div id="tekstikast">
            jQuery - see on raamastik (teek)
            <br>
            CDN - raamastiku allalaadimisviis välisserverist
            <br>
            Ametlik CDN asub https://releases.jquery.com/
        </div>
        <input type="button" value="vasakule" id="vasakule"
               class="vihjemull" title="Liigutab teksti vasakule">
        <input type="button" value="paremale" id="paremale"
               class="vihjemull" title="Liigutab teksti paremale">
        <input type="button" value="peida tekst"
               class="vihjemull" title="Peidab tekstikasti"
               onclick="$('#tekstikast').hide(2000)">
        <input type="button" value="kuva tekst"
               class="vihjemull" title="Näitab tekstikasti uuesti"
               onclick="$('#tekstikast').show(2000, alert('Kohe kuvatakse tekst'))">
    </section>
    <div id="koordinaadid"></div>
    <img src="https://img.magnific.com/free-psd/transparent-glass-sphere-study-light-reflection_632498-24532.jpg?semt=ais_hybrid&w=740&q=80" alt="" id="pilt">
    <section id="fading">
        <h2>jQuery Fading</h2>

        <p>jQuery abil saab pilti näidata ja peita</p>

        <p>Vajuta nuppudele ja proovi erinevaid efekte</p>

        <input type="button" value="toob nähtavale" id="fadeIn"
               class="vihjemull" title="Näitab pildi kahe sekundi jooksul">
        <input type="button" value="peidab" id="fadeOut">
        <input type="button" value="kui on nähtav, peidab" id="fadeToggle">
        <input type="button" value="Muudab elemendi läbipaistvuse" id="fadeTo">

        <br><br>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkZ3uVyidntSrxeIsH8G2i4QpLTUpPxRiUYrXWyWe2rw&s=10"
             id="fadePilt" width="200" alt="Pilt" style="display:none;">
    </section>
</main>
</body>
</html>
